
---
- name: Server Health Report
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Check disk space
      ansible.builtin.command: df -h /
      register: disk_result
      changed_when: false

    - name: Check memory
      ansible.builtin.command: free -m
      register: memory_result
      changed_when: false

    - name: Check running services
      ansible.builtin.shell: systemctl list-units --type=service --state=running | head -20
      register: services_result
      changed_when: false

    - name: Display server health report
      ansible.builtin.debug:
        msg:
          - "========== {{ inventory_hostname }} =========="
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "IP: {{ ansible_default_ipv4.address }}"
          - "RAM: {{ ansible_memtotal_mb }} MB"
          - "Disk: {{ disk_result.stdout_lines[1] | default(disk_result.stdout) }}"
          - "Memory details: {{ memory_result.stdout_lines | join(' | ') }}"
          - "Running services (first 20): {{ services_result.stdout_lines | length }} lines"

    - name: Flag critically low disk space
      ansible.builtin.debug:
        msg: "ALERT: Check disk space on {{ inventory_hostname }} — disk usage is at least 90%."
      when: disk_result.stdout is regex('(?:9[0-9]|100)%')

    - name: Save report on the server
      ansible.builtin.copy:
        content: |
          Server Health Report
          ====================
          Server: {{ inventory_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          IP: {{ ansible_default_ipv4.address }}
          RAM: {{ ansible_memtotal_mb }} MB

          Disk Usage:
          {{ disk_result.stdout }}

          Memory:
          {{ memory_result.stdout }}

          Running Services (first 20):
          {{ services_result.stdout }}

          Checked at: {{ ansible_date_time.iso8601 }}
        dest: "/tmp/server-report-{{ inventory_hostname }}.txt"
        mode: '0644'


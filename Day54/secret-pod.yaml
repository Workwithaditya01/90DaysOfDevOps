apiVersion: v1
kind: Pod
metadata:
  name: secret-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "DB_USER from environment: $DB_USER"
          echo "Secret files:"
          ls -l /etc/db-credentials
          echo "DB_USER file:"
          cat /etc/db-credentials/DB_USER
          echo "DB_PASSWORD file:"
          cat /etc/db-credentials/DB_PASSWORD
          sleep 3600

      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER

      volumeMounts:
        - name: db-credentials-volume
          mountPath: /etc/db-credentials
          readOnly: true

  volumes:
    - name: db-credentials-volume
      secret:
        secretName: db-credentials

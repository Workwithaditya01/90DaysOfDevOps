# Day 44 – Secrets, Artifacts & Running Real Tests in CI

## Objective

Today I learned how GitHub Actions securely manages secrets, stores workflow artifacts, runs actual tests, and caches dependencies to speed up CI pipelines.

---

## Task 1 – GitHub Secrets

- Created a repository secret named `MY_SECRET_MESSAGE`.
- Verified whether the secret was available in the workflow.
- Attempted to print the secret and observed that GitHub automatically masked its value with `***`.

### Why should secrets never be printed?

Secrets may contain passwords, API keys, or access tokens. Printing them in workflow logs can expose sensitive information to anyone with access to the repository or workflow logs. GitHub masks secret values automatically, but workflows should never intentionally print them.

---

## Task 2 – Environment Variables

- Added `DOCKER_USERNAME` and `DOCKER_TOKEN` as repository secrets.
- Passed them into a workflow step using environment variables.
- Verified that the secrets were available without exposing their values.

---

## Task 3 – Upload Artifacts

- Generated a sample report file.
- Uploaded it using `actions/upload-artifact@v4`.
- Successfully downloaded the artifact from the GitHub Actions page.

---

## Task 4 – Download Artifacts Between Jobs

- Generated an artifact in one job.
- Downloaded it in another job using `actions/download-artifact@v4`.
- Printed its contents successfully.

### Real-world use cases

- Sharing build outputs between jobs
- Passing test reports
- Deployment packages
- Build logs for debugging

---

## Task 5 – Running Real Tests

- Added a shell script and a Python test to the repository.
- Configured GitHub Actions to execute both.
- Intentionally introduced a failing assertion to verify that the workflow failed.
- Fixed the test and confirmed the workflow passed successfully.


---

## Task 6 – Dependency Caching

- Configured `actions/cache@v4` for Python dependencies.
- Observed a cache miss on the first run and a cache hit on the second run.

### What is cached?

The workflow caches downloaded Python packages located in `~/.cache/pip`.

### Where is the cache stored?

The cache is stored on GitHub's infrastructure and is restored automatically when the cache key matches.

---

## Key Learnings

- GitHub Secrets securely store sensitive information.
- Secret values are automatically masked in workflow logs.
- Artifacts allow files to be shared between jobs and downloaded after a workflow completes.
- CI pipelines should run real tests to catch failures before deployment.
- Dependency caching significantly speeds up repeated workflow runs.
